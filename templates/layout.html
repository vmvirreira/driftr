<!-- layout.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP3 Globe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <nav class="container py-3 d-flex gap-3 align-items-center" aria-label="Admin navigation">
        <a href="{{ url_for('index') }}">Back to driftr</a>
        <a href="{{ url_for('manage_countries') }}">Countries</a>
        <a href="{{ url_for('manage_categories') }}">Categories</a>
        <form action="{{ url_for('admin_logout') }}" method="POST" class="ms-auto">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button class="btn btn-outline-secondary btn-sm">Sign out</button>
        </form>
    </nav>
    <div class="container"><p class="alert alert-info">{% if g.catalog_persistent %}Admin access verified. Changes are saved to the Supabase music catalog.{% else %}Admin access verified. Run the Supabase catalog migration to enable persistent editing.{% endif %}</p></div>
    {% block content %}{% endblock %}
</body>
</html>
